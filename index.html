<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>looka.click</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@800&display=swap" rel="stylesheet">
<link rel="preload" as="fetch" href="https://octothorp.es/?uri=https://looka.click" >
<style>
  :root {
    /* eye-w/eye-h and border are measured from Jost's actual lowercase "o" glyph ink, not guessed */
    --eye-w: 0.543em;
    --eye-h: 0.484em;
    --eye-border: 0.172em;
    --pupil-size: 1.5; /* multiplier on the original hole's dimensions */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #fff;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
  }
  .word {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Jost", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-weight: 800;
    line-height: 1;
    color: #070014;
    font-size: 26vw;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    white-space: nowrap;
  }
  .letter {
    /* flex items respect z-index even without position set; keeps letters above a pupil that overshoots the eye */
    z-index: 1;
    display: inline-block;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
  }
  .eye {
    /* no overflow:hidden on purpose: pupil paints over the border instead of being clipped by it, avoiding a seam */
    /* scaled as a whole during blink, so the pupil (its child) squashes along with it automatically */
    position: relative;
    top: 0.118em; /* lowercase "o" sits lower (x-height) than the eye's default flex-centered position */
    width: var(--eye-w);
    height: var(--eye-h);
    margin: 0 0.02em;
    border-radius: 50%;
    background: #070014;
    border: var(--eye-border) solid #070014;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    will-change: transform;
    z-index: 0; /* explicit, so .letter's z-index: 1 unambiguously wins against this stacking context */
  }
  .pupil {
    /* sized relative to the original white hole (eye minus border on each side), scaled by --pupil-size */
    position: absolute;
    width: calc((var(--eye-w) - 2 * var(--eye-border)) * var(--pupil-size));
    height: calc((var(--eye-h) - 2 * var(--eye-border)) * var(--pupil-size));
    border-radius: 50%;
    background: #fff;
    top: 50%;
    left: 50%;
    margin-top: calc((var(--eye-h) - 2 * var(--eye-border)) * var(--pupil-size) / -2);
    margin-left: calc((var(--eye-w) - 2 * var(--eye-border)) * var(--pupil-size) / -2);
    will-change: transform;
  }
  .lidMask {
    /* clipping window, oversized by the border width so a fully-closed lid paints over the border seamlessly */
    position: absolute;
    inset: calc(-1 * var(--eye-border));
    border-radius: 50%;
    overflow: hidden;
    pointer-events: none;
  }
  .lidTop, .lidBottom {
    /* fixed shape (not scaled) that physically slides through the mask, like a shutter */
    position: absolute;
    inset: 0;
    background: #070014;
  }
  .lidTop { border-radius: 50%; transform: translateY(-100%); } /* leading edge matches the eye's own curvature */
  .lidBottom { border-radius: 50% / 18%; transform: translateY(100%); } /* flatter leading edge than the top lid */
</style>
</head>
<body>
  <div class="word" id="word">
    <span class="letter">L</span><div class="eye" id="leftEye"><div class="pupil"></div><div class="lidMask"><div class="lidTop"></div><div class="lidBottom"></div></div></div><div class="eye" id="rightEye"><div class="pupil"></div><div class="lidMask"><div class="lidTop"></div><div class="lidBottom"></div></div></div><span class="letter">k</span><span class="letter">a</span>
  </div>

<script>
  const eyes = Array.from(document.querySelectorAll('.eye')).map(eye => ({
    el: eye,
    pupil: eye.querySelector('.pupil'),
    lidTop: eye.querySelector('.lidTop'),
    lidBottom: eye.querySelector('.lidBottom')
  }));

  // real blinks are upper-lid-dominant: the top lid does ~92% of the travel, the bottom
  // lid rises only ~8% to meet it, and the eye visibly compresses (squashes) as it closes
  const BOTTOM_LID_SHARE = 0.08;
  const CLOSE_OFFSET = 0.2, HOLD_OFFSET = 0.28; // close fast, reopen slow (same ratio as before)

  function blink() {
    eyes.forEach(({ el, lidTop, lidBottom }) => {
      lidTop.animate([
        { transform: 'translateY(-100%)', offset: 0 },
        { transform: `translateY(${-BOTTOM_LID_SHARE * 100}%)`, offset: CLOSE_OFFSET, easing: 'ease-out' },
        { transform: `translateY(${-BOTTOM_LID_SHARE * 100}%)`, offset: HOLD_OFFSET },
        { transform: 'translateY(-100%)', offset: 1, easing: 'ease-in-out' }
      ], { duration: 350 });

      lidBottom.animate([
        { transform: 'translateY(100%)', offset: 0 },
        { transform: `translateY(${(1 - BOTTOM_LID_SHARE) * 100}%)`, offset: CLOSE_OFFSET, easing: 'ease-out' },
        { transform: `translateY(${(1 - BOTTOM_LID_SHARE) * 100}%)`, offset: HOLD_OFFSET },
        { transform: 'translateY(100%)', offset: 1, easing: 'ease-in-out' }
      ], { duration: 350 });

      // the whole eye (and its child pupil, along with it) compresses as the lids close
      el.animate([
        { transform: 'scale(1, 1)', offset: 0 },
        { transform: 'scale(1.01, 0.95)', offset: CLOSE_OFFSET, easing: 'ease-out' },
        { transform: 'scale(1.01, 0.95)', offset: HOLD_OFFSET },
        { transform: 'scale(1, 1)', offset: 1, easing: 'ease-in-out' }
      ], { duration: 350 });
    });
  }

  window.addEventListener('click', blink);

  const OVERSHOOT = 0.15; // fraction of the eye's radius the pupil may poke past the outer edge
  const PULL_START = 3.5; // cursor must be this many true-edge-distances away before the pull begins
  const PULL_END = 12; // pull is fully maxed out by this many true-edge-distances away (wide = gradual ramp)

  function trackEyes(cursorX, cursorY) {
    eyes.forEach(({ el, pupil }) => {
      const eyeRect = el.getBoundingClientRect();
      const eyeCenterX = eyeRect.left + eyeRect.width / 2;
      const eyeCenterY = eyeRect.top + eyeRect.height / 2;

      const pupilRect = pupil.getBoundingClientRect();

      const cursorOffsetX = cursorX - eyeCenterX;
      const cursorOffsetY = cursorY - eyeCenterY;

      // true edge (no overshoot) and the absolute max once fully "pulled" past it
      const edgeOffsetX = eyeRect.width / 2 - pupilRect.width / 2;
      const edgeOffsetY = eyeRect.height / 2 - pupilRect.height / 2;
      const pulledOffsetX = eyeRect.width / 2 * (1 + OVERSHOOT) - pupilRect.width / 2;
      const pulledOffsetY = eyeRect.height / 2 * (1 + OVERSHOOT) - pupilRect.height / 2;

      const angle = Math.atan2(cursorOffsetY, cursorOffsetX);
      // 0 at eye center, 1 exactly at the true edge, keeps growing past 1 the farther the cursor goes
      const rawDistFraction = Math.hypot(cursorOffsetX / edgeOffsetX, cursorOffsetY / edgeOffsetY);
      // normal tracking: 0 to 1 as the cursor approaches the true edge, pinned at 1 beyond it
      const distFraction = Math.min(1, rawDistFraction);
      // stays at 0 until the cursor is PULL_START edge-distances away, then ramps up to maxed by PULL_END
      const pulledFraction = Math.min(1, Math.max(0, (rawDistFraction - PULL_START) / (PULL_END - PULL_START)));

      const pupilOffsetX = Math.cos(angle) * (edgeOffsetX * distFraction + (pulledOffsetX - edgeOffsetX) * pulledFraction);
      const pupilOffsetY = Math.sin(angle) * (edgeOffsetY * distFraction + (pulledOffsetY - edgeOffsetY) * pulledFraction);

      pupil.style.transform = `translate(${pupilOffsetX}px, ${pupilOffsetY}px)`;
    });
  }

  window.addEventListener('mousemove', e => trackEyes(e.clientX, e.clientY));

  window.addEventListener('touchstart', e => {
    if (e.touches.length) trackEyes(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  window.addEventListener('touchmove', e => {
    if (e.touches.length) trackEyes(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  window.addEventListener('touchend', e => {
    // pupils stay put after this; nothing calls trackEyes again until the next touchstart
    e.preventDefault(); // suppress the synthesized click that would otherwise double-fire blink()
    blink();
  });

  // idle default, before any cursor movement: target is far above the viewport, so eyes look up
  trackEyes(window.innerWidth / 2, -window.innerHeight);
</script>
</body>
</html>
