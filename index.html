<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>looka.click</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@800&display=swap" rel="stylesheet">
<style>
  :root {
    /* eye-w/eye-h and border are measured from Jost's actual lowercase "o" glyph ink, not guessed */
    --eye-w: 0.543em;
    --eye-h: 0.484em;
    --eye-border: 0.172em;
    --pupil-size: 1.5; /* multiplier on the original hole's dimensions */
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #fff;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
  }
  .word {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Jost", -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-weight: 800;
    line-height: 1;
    color: #070014;
    font-size: 26vw;
    user-select: none;
    white-space: nowrap;
  }
  .letter {
    display: inline-block;
  }
  .eye {
    /* no overflow:hidden on purpose: pupil paints over the border instead of being clipped by it, avoiding a seam */
    position: relative;
    top: 0.118em; /* lowercase "o" sits lower (x-height) than the eye's default flex-centered position */
    width: var(--eye-w);
    height: var(--eye-h);
    margin: 0 0.02em;
    border-radius: 50%;
    background: #070014;
    border: var(--eye-border) solid #070014;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .pupil {
    /* sized relative to the original white hole (eye minus border on each side), scaled by --pupil-size */
    position: absolute;
    width: calc((var(--eye-w) - 2 * var(--eye-border)) * var(--pupil-size));
    height: calc((var(--eye-h) - 2 * var(--eye-border)) * var(--pupil-size));
    border-radius: 50%;
    background: #fff;
    top: 50%;
    left: 50%;
    margin-top: calc((var(--eye-h) - 2 * var(--eye-border)) * var(--pupil-size) / -2);
    margin-left: calc((var(--eye-w) - 2 * var(--eye-border)) * var(--pupil-size) / -2);
    will-change: transform;
  }
  .lidMask {
    /* clipping window, oversized by the border width so a fully-closed lid paints over the border seamlessly */
    position: absolute;
    inset: calc(-1 * var(--eye-border));
    border-radius: 50%;
    overflow: hidden;
    pointer-events: none;
  }
  .lid {
    /* fixed oval shape (not scaled) that physically slides down through the mask, like a shutter */
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: #070014;
    transform: translateY(-100%);
  }
</style>
</head>
<body>
  <div class="word" id="word">
    <span class="letter">L</span><div class="eye" id="leftEye"><div class="pupil"></div><div class="lidMask"><div class="lid"></div></div></div><div class="eye" id="rightEye"><div class="pupil"></div><div class="lidMask"><div class="lid"></div></div></div><span class="letter">k</span><span class="letter">a</span>
  </div>

<script>
  const eyes = Array.from(document.querySelectorAll('.eye')).map(eye => ({
    el: eye,
    pupil: eye.querySelector('.pupil'),
    lid: eye.querySelector('.lid')
  }));

  function blink() {
    eyes.forEach(({ lid }) => {
      // real blinks close fast (reflexive muscle contraction) and reopen much slower
      // (the levator muscle lifting the lid back up) — roughly a 1:3.5 close:open ratio
      lid.animate([
        { transform: 'translateY(-100%)', offset: 0 },
        { transform: 'translateY(0%)', offset: 0.2, easing: 'ease-out' },
        { transform: 'translateY(0%)', offset: 0.28 },
        { transform: 'translateY(-100%)', offset: 1, easing: 'ease-in-out' }
      ], { duration: 350 });
    });
  }

  window.addEventListener('click', blink);

  const OVERSHOOT = 0.15; // fraction of the eye's radius the pupil may poke past the outer edge

  function trackEyes(cursorX, cursorY) {
    eyes.forEach(({ el, pupil }) => {
      const eyeRect = el.getBoundingClientRect();
      const eyeCenterX = eyeRect.left + eyeRect.width / 2;
      const eyeCenterY = eyeRect.top + eyeRect.height / 2;

      const pupilRect = pupil.getBoundingClientRect();

      const cursorOffsetX = cursorX - eyeCenterX;
      const cursorOffsetY = cursorY - eyeCenterY;

      // pupil center can travel past the eye's outer radius by OVERSHOOT, so it can poke slightly outside
      const maxOffsetX = eyeRect.width / 2 * (1 + OVERSHOOT) - pupilRect.width / 2;
      const maxOffsetY = eyeRect.height / 2 * (1 + OVERSHOOT) - pupilRect.height / 2;

      const angle = Math.atan2(cursorOffsetY, cursorOffsetX);
      // scales travel by actual cursor distance, so it tracks precisely when near, caps at the edge when far
      const distFraction = Math.min(1, Math.hypot(cursorOffsetX / maxOffsetX, cursorOffsetY / maxOffsetY));

      const pupilOffsetX = Math.cos(angle) * maxOffsetX * distFraction;
      const pupilOffsetY = Math.sin(angle) * maxOffsetY * distFraction;

      pupil.style.transform = `translate(${pupilOffsetX}px, ${pupilOffsetY}px)`;
    });
  }

  window.addEventListener('mousemove', e => trackEyes(e.clientX, e.clientY));

  window.addEventListener('touchstart', e => {
    if (e.touches.length) trackEyes(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  window.addEventListener('touchmove', e => {
    if (e.touches.length) trackEyes(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  window.addEventListener('touchend', e => {
    // pupils stay put after this; nothing calls trackEyes again until the next touchstart
    e.preventDefault(); // suppress the synthesized click that would otherwise double-fire blink()
    blink();
  });

  // idle default, before any cursor movement: target is far above the viewport, so eyes look up
  trackEyes(window.innerWidth / 2, -window.innerHeight);
</script>
</body>
</html>
